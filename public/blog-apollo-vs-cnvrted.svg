<svg viewBox="0 0 1680 945" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Apollo versus Cnvrted">
  <defs>
    <radialGradient id="wglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="whub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="apollodots" x="0" y="0" width="40" height="38" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="4.5" fill="#B6B915"/>
    </pattern>
    <linearGradient id="vsline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a8a8a" stop-opacity="0"/>
      <stop offset="1" stop-color="#8a8a8a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="vsline2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a8a8a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8a8a8a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1680" height="945" fill="#0A0A0A"/>
  <line x1="840" y1="60" x2="840" y2="885" stroke="#1e1e1e" stroke-width="1"/>

  <!-- ================= LEFT: Apollo ================= -->
  <!-- sparkle mark -->
  <g transform="translate(238,222)" fill="#E4E70D">
    <g id="petal"><path d="M0 -4 L6 -36 L-6 -36 Z"/></g>
    <use href="#petal" transform="rotate(0)"/>
    <use href="#petal" transform="rotate(45)"/>
    <use href="#petal" transform="rotate(90)"/>
    <use href="#petal" transform="rotate(135)"/>
    <use href="#petal" transform="rotate(180)"/>
    <use href="#petal" transform="rotate(225)"/>
    <use href="#petal" transform="rotate(270)"/>
    <use href="#petal" transform="rotate(315)"/>
    <circle cx="0" cy="0" r="7.5"/>
  </g>
  <text x="298" y="242" font-size="58" fill="#E4E70D" font-family="var(--font-display), 'Bricolage Grotesque', sans-serif" style="font-weight:600">Apollo</text>

  <!-- yellow dot grid -->
  <rect x="112" y="356" width="520" height="494" fill="url(#apollodots)"/>

  <!-- ================= centre: VS ================= -->
  <line x1="742" y1="512" x2="806" y2="512" stroke="url(#vsline)" stroke-width="2"/>
  <text x="840" y="522" text-anchor="middle" font-size="27" fill="#EDEDED" font-family="'Courier New', monospace" letter-spacing="2" style="font-weight:700">VS</text>
  <line x1="874" y1="512" x2="938" y2="512" stroke="url(#vsline2)" stroke-width="2"/>

  <!-- ================= RIGHT: Cnvrted ================= -->
  <!-- orbit mark (brand logo, scaled) -->
  <g transform="translate(1115,138) scale(3.25)" fill="none">
    <circle cx="20" cy="20" r="5.5" fill="#EDEDED"/>
    <path d="M25 11.5A11 11 0 0 1 30.5 21" stroke="#EDEDED" stroke-width="3.2" stroke-linecap="round" opacity="0.72"/>
    <path d="M15 28.5A11 11 0 0 1 9.5 19" stroke="#EDEDED" stroke-width="3.2" stroke-linecap="round" opacity="0.72"/>
  </g>
  <text x="1179" y="332" text-anchor="middle" font-size="56" fill="#EDEDED" font-family="var(--font-display), 'Bricolage Grotesque', sans-serif" style="font-weight:600">Cnvrted</text>

  <!-- signal-burst network (white) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5">
    <path d="M1290 655 Q1360 500 1440 335"/>
    <path d="M1290 655 Q1300 560 1305 468"/>
    <path d="M1290 655 Q1230 540 1186 404"/>
    <path d="M1290 655 Q1400 620 1470 588"/>
    <path d="M1290 655 Q1110 630 926 600"/>
    <path d="M1290 655 Q1070 690 856 710"/>
    <path d="M1290 655 Q1120 720 976 776"/>
    <path d="M1290 655 Q1170 780 1046 894"/>
    <path d="M1290 655 Q1320 780 1340 890"/>
    <path d="M1290 655 Q1390 745 1450 820"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.7">
    <path d="M1290 655 Q1290 600 1250 546"/>
    <path d="M1290 655 Q1360 610 1372 560"/>
  </g>

  <!-- dim nodes -->
  <g fill="#3a3a3a">
    <circle cx="1150" cy="600" r="5"/><circle cx="1255" cy="760" r="4"/><circle cx="1490" cy="700" r="5"/>
    <circle cx="905" cy="508" r="4"/><circle cx="1235" cy="585" r="3"/><circle cx="1420" cy="470" r="4"/>
  </g>

  <!-- white signal nodes with glow -->
  <g>
    <circle cx="1290" cy="655" r="66" fill="url(#whub)"/>
    <circle cx="1290" cy="655" r="28" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.28"/>
    <circle cx="1290" cy="655" r="11" fill="#FFFFFF"/>

    <circle cx="1440" cy="335" r="34" fill="url(#wglow)"/><circle cx="1440" cy="335" r="8" fill="#FFFFFF"/>
    <circle cx="1305" cy="468" r="28" fill="url(#wglow)"/><circle cx="1305" cy="468" r="6" fill="#FFFFFF"/>
    <circle cx="1186" cy="404" r="28" fill="url(#wglow)"/><circle cx="1186" cy="404" r="6" fill="#FFFFFF"/>
    <circle cx="1470" cy="588" r="34" fill="url(#wglow)"/><circle cx="1470" cy="588" r="8" fill="#FFFFFF"/>
    <circle cx="926" cy="600" r="34" fill="url(#wglow)"/><circle cx="926" cy="600" r="8" fill="#FFFFFF"/>
    <circle cx="856" cy="710" r="30" fill="url(#wglow)"/><circle cx="856" cy="710" r="7" fill="#FFFFFF"/>
    <circle cx="976" cy="776" r="26" fill="url(#wglow)"/><circle cx="976" cy="776" r="6" fill="#FFFFFF"/>
    <circle cx="1046" cy="894" r="30" fill="url(#wglow)"/><circle cx="1046" cy="894" r="7" fill="#FFFFFF"/>
    <circle cx="1340" cy="890" r="30" fill="url(#wglow)"/><circle cx="1340" cy="890" r="7" fill="#FFFFFF"/>
    <circle cx="1450" cy="820" r="30" fill="url(#wglow)"/><circle cx="1450" cy="820" r="7" fill="#FFFFFF"/>
    <circle cx="1250" cy="546" r="22" fill="url(#wglow)"/><circle cx="1250" cy="546" r="5" fill="#FFFFFF"/>
    <circle cx="1372" cy="560" r="22" fill="url(#wglow)"/><circle cx="1372" cy="560" r="5" fill="#FFFFFF"/>
  </g>
</svg>
