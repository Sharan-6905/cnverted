<svg viewBox="0 0 1680 945" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Apollo versus Cnvrted — names versus buyers">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1A30"/>
      <stop offset="0.55" stop-color="#0A1628"/>
      <stop offset="1" stop-color="#081120"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C6F135" stop-opacity="0.6"/>
      <stop offset="0.35" stop-color="#B6E400" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#B6E400" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EAFFA0" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#C6F135" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#B6E400" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotgrid" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="7" fill="#3c4d5f"/>
    </pattern>
    <style>
      .mono2 { font-family: 'Courier New', ui-monospace, monospace; letter-spacing: 1.5px; }
      .t-dim { fill: #46586a; }
      .t-mut { fill: #64798c; }
      .t-lime { fill: #b6e400; }
      .net { fill: none; stroke: #b6e400; }
    </style>
  </defs>

  <rect width="1680" height="945" fill="url(#bg2)"/>

  <!-- centre divider -->
  <line x1="840" y1="70" x2="840" y2="875" stroke="#1c2c40" stroke-width="1"/>
  <!-- transition marker: dotted trail + chevron -->
  <g fill="#5a6f82">
    <circle cx="806" cy="472" r="2.4"/><circle cx="818" cy="472" r="2"/><circle cx="828" cy="472" r="1.6"/>
  </g>
  <path d="M846 462 L858 472 L846 482" fill="none" stroke="#7d94a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== top ticker ===== -->
  <g class="mono2" font-size="14">
    <text x="34" y="42" class="t-mut">AT 14:32</text>
    <text x="164" y="42" class="t-dim">XLE</text><text x="210" y="42" class="t-lime">↑ 67.21</text><text x="318" y="42" class="t-dim">-0.45</text>
    <text x="410" y="42" class="t-dim">CRM 271.96</text><text x="566" y="42" class="t-lime">+1.28</text>
    <text x="660" y="42" class="t-dim">INTC 31.23</text>
  </g>
  <g class="mono2" font-size="14">
    <text x="862" y="42" class="t-dim">NQ1! 19,538.75</text><text x="1066" y="42" class="t-lime">+0.72%</text>
    <text x="1172" y="42" class="t-dim">CL1! 78.64</text><text x="1312" y="42" class="t-lime">+1.12%</text>
    <text x="1418" y="42" class="t-dim">DX1! 104.21</text>
    <text x="1574" y="42" class="t-mut">NEWS</text><rect x="1638" y="32" width="10" height="10" fill="#b6e400" opacity="0.8"/>
  </g>

  <!-- ============ LEFT: Cnvrted / names ============ -->
  <!-- logo mark: orbit -->
  <g transform="translate(232,142)" stroke="#8794a3" fill="none">
    <circle cx="0" cy="0" r="13" fill="#8794a3" stroke="none"/>
    <ellipse cx="0" cy="0" rx="30" ry="14" stroke-width="4" transform="rotate(-30)"/>
    <circle cx="26" cy="-15" r="6" fill="#8794a3" stroke="none"/>
  </g>
  <text x="292" y="158" class="mono2" font-size="52" fill="#8794a3" font-family="var(--font-display), 'Bricolage Grotesque', sans-serif" letter-spacing="0" style="font-weight:600">Cnvrted</text>

  <!-- dot grid (the static database of names) -->
  <rect x="34" y="232" width="726" height="660" fill="url(#dotgrid)"/>

  <!-- ============ RIGHT: Apollo / buyers ============ -->
  <!-- signal-burst network -->
  <g class="net" stroke-width="1.6" opacity="0.55">
    <path d="M1290 545 Q1250 400 1256 262"/>
    <path d="M1290 545 Q1410 445 1466 378"/>
    <path d="M1290 545 Q1150 455 1034 424"/>
    <path d="M1290 545 Q1090 420 950 344"/>
    <path d="M1290 545 Q1120 610 922 660"/>
    <path d="M1290 545 Q1195 705 1108 828"/>
    <path d="M1290 545 Q1395 655 1442 762"/>
    <path d="M1290 545 Q1440 565 1522 620"/>
    <path d="M1290 545 Q1470 505 1610 492"/>
    <path d="M1290 545 Q1235 615 1162 690"/>
    <path d="M1290 545 Q1330 415 1360 302"/>
  </g>
  <g class="net" stroke-width="1.4" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.75">
    <path d="M1290 545 Q1440 462 1560 408"/>
    <path d="M1290 545 Q1160 530 1052 546"/>
    <path d="M1290 545 Q1430 405 1520 306"/>
    <path d="M1290 545 Q1250 690 1300 826"/>
  </g>

  <!-- dim (unconnected) grey nodes -->
  <g fill="#42566a">
    <circle cx="1084" cy="700" r="5"/><circle cx="1236" cy="758" r="4"/><circle cx="1588" cy="690" r="5"/>
    <circle cx="1004" cy="486" r="4"/><circle cx="1402" cy="560" r="4"/><circle cx="1186" cy="410" r="4"/>
    <circle cx="1500" cy="782" r="5"/><circle cx="1352" cy="470" r="3"/><circle cx="1600" cy="590" r="3"/>
  </g>
  <!-- faint crosshairs -->
  <g stroke="#31465b" stroke-width="1.4">
    <g id="c2"><line x1="-6" y1="0" x2="6" y2="0"/><line x1="0" y1="-6" x2="0" y2="6"/></g>
    <use href="#c2" x="900" y="470"/><use href="#c2" x="1130" y="300"/><use href="#c2" x="1560" y="640"/>
    <use href="#c2" x="1030" y="720"/><use href="#c2" x="1440" y="360"/><use href="#c2" x="1310" y="700"/>
  </g>

  <!-- lime signal nodes with glow -->
  <g>
    <!-- central hub -->
    <circle cx="1290" cy="545" r="70" fill="url(#core2)"/>
    <circle cx="1290" cy="545" r="30" fill="none" stroke="#b6e400" stroke-width="1" opacity="0.3"/>
    <circle cx="1290" cy="545" r="11" fill="#EAFFA0"/>

    <g>
      <!-- helper: each node = glow + core -->
      <circle cx="1256" cy="262" r="34" fill="url(#glow2)"/><circle cx="1256" cy="262" r="8" fill="#cff23a"/>
      <circle cx="1466" cy="378" r="46" fill="url(#glow2)"/><circle cx="1466" cy="378" r="12" fill="#cff23a"/>
      <circle cx="1034" cy="424" r="40" fill="url(#glow2)"/><circle cx="1034" cy="424" r="10" fill="#cff23a"/>
      <circle cx="950" cy="344" r="30" fill="url(#glow2)"/><circle cx="950" cy="344" r="7" fill="#cff23a"/>
      <circle cx="922" cy="660" r="30" fill="url(#glow2)"/><circle cx="922" cy="660" r="7" fill="#cff23a"/>
      <circle cx="1108" cy="828" r="40" fill="url(#glow2)"/><circle cx="1108" cy="828" r="10" fill="#cff23a"/>
      <circle cx="1442" cy="762" r="38" fill="url(#glow2)"/><circle cx="1442" cy="762" r="9" fill="#cff23a"/>
      <circle cx="1522" cy="620" r="40" fill="url(#glow2)"/><circle cx="1522" cy="620" r="10" fill="#cff23a"/>
      <circle cx="1610" cy="492" r="26" fill="url(#glow2)"/><circle cx="1610" cy="492" r="6" fill="#cff23a"/>
      <circle cx="1162" cy="690" r="26" fill="url(#glow2)"/><circle cx="1162" cy="690" r="6" fill="#cff23a"/>
      <circle cx="1360" cy="302" r="28" fill="url(#glow2)"/><circle cx="1360" cy="302" r="7" fill="#cff23a"/>
      <circle cx="1560" cy="408" r="22" fill="url(#glow2)"/><circle cx="1560" cy="408" r="5" fill="#cff23a"/>
      <circle cx="1052" cy="546" r="22" fill="url(#glow2)"/><circle cx="1052" cy="546" r="5" fill="#cff23a"/>
    </g>
  </g>

  <!-- Apollo logo: 8-point sparkle + wordmark -->
  <g transform="translate(1130,140)" fill="#C6F135">
    <g id="petal"><path d="M0 -4 L6 -34 L-6 -34 Z" transform="translate(0,0)"/></g>
    <use href="#petal" transform="rotate(0)"/>
    <use href="#petal" transform="rotate(45)"/>
    <use href="#petal" transform="rotate(90)"/>
    <use href="#petal" transform="rotate(135)"/>
    <use href="#petal" transform="rotate(180)"/>
    <use href="#petal" transform="rotate(225)"/>
    <use href="#petal" transform="rotate(270)"/>
    <use href="#petal" transform="rotate(315)"/>
    <circle cx="0" cy="0" r="7"/>
  </g>
  <text x="1180" y="158" font-size="52" fill="#C6F135" font-family="var(--font-display), 'Bricolage Grotesque', sans-serif" letter-spacing="0" style="font-weight:600">Apollo</text>
</svg>
